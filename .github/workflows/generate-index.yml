name: Aggiorna Indice JSON

on:
  push:
    paths:
      - 'manuali/**'
      - 'PackingLists/**'
  workflow_dispatch: # Permette anche di avviarlo manualmente con un click

permissions:
  contents: write

jobs:
  build-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Genera JSON con Python
        run: |
          python - << 'EOF'
          import os
          import json

          def scan_folder(folder_path):
              items = []
              if not os.path.exists(folder_path):
                  return items
              for filename in sorted(os.listdir(folder_path)):
                  if filename.endswith(".md"):
                      path = os.path.join(folder_path, filename)
                      title = filename.replace(".md", "").replace("_", " ").title()
                      
                      # Prova a leggere il primo H1 (# Titolo) dal file
                      try:
                          with open(path, "r", encoding="utf-8") as f:
                              for line in f:
                                  if line.startswith("# "):
                                      title = line.replace("# ", "").strip()
                                      break
                      except Exception:
                          pass

                      items.append({
                          "filename": filename,
                          "title": title,
                          "path": path
                      })
              return items

          index_data = {
              "manuali": scan_folder("manuali"),
              "packaging": scan_folder("packaging")
          }

          with open("indice.json", "w", encoding="utf-8") as f:
              json.dump(index_data, f, indent=2, ensure_ascii=False)
          EOF

      - name: Commit e Push delle modifiche
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add indice.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-aggiornamento indice.json [skip ci]" && git push)
